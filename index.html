<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Växtglosor</title>
<meta name="description" content="Öva på svenska och latinska namn på perenner.">
<meta name="theme-color" content="#2f5d3a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🌿 Växtglosor</h1>
  <div class="header-right">
    <span id="counter" aria-live="polite"></span>
    <button id="pick" class="pick">Välj växter</button>
  </div>
</header>

<dialog id="picker" class="picker">
  <form method="dialog">
    <h2>Välj växter</h2>
    <div class="picker-quick">
      <button type="button" id="pick-all">Alla</button>
      <button type="button" id="pick-none">Inga</button>
      <span id="pick-count"></span>
    </div>
    <ul id="pick-list" class="pick-list"></ul>
    <button id="pick-done" class="pick-done">Klar</button>
  </form>
</dialog>

<main>
  <div class="scene">
    <div id="card" class="card" role="button" tabindex="0" aria-label="Vänd kortet">
      <div class="face front">
        <div id="track" class="track"></div>
        <button id="img-prev" class="img-nav prev" aria-label="Föregående bild">‹</button>
        <button id="img-next" class="img-nav next" aria-label="Nästa bild">›</button>
        <div id="dots" class="dots"></div>
        <span class="hint">Tryck för att vända</span>
        <p id="credit" class="credit"></p>
      </div>
      <div class="face back">
        <h2 id="sv"></h2>
        <p id="latin" class="latin"></p>
        <p id="info" class="info"></p>
        <p class="meaning"><strong>Namnet betyder:</strong> <span id="betydelse"></span></p>
      </div>
    </div>
  </div>

  <nav class="controls">
    <button id="prev" aria-label="Föregående">‹</button>
    <button id="shuffle">Blanda</button>
    <button id="next" aria-label="Nästa">›</button>
  </nav>
</main>

<footer>
  Bilder från <a href="https://commons.wikimedia.org">Wikimedia Commons</a> under fria licenser.
</footer>

<script src="app.js"></script>
</body>
</html>
